<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>observatory</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel2: #1c2230;
    --line: #21262d;
    --text: #e6edf3;
    --dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --amber: #d29922;
    --violet: #bc8cff;
    --accent-soft: rgba(88, 166, 255, .12);
    --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; overflow: hidden; display: flex; flex-direction: column; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a3140; border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: inherit; }

  /* ---------- topbar: minibank chrome ---------- */
  .topbar {
    flex: none; display: flex; align-items: center; gap: 20px; padding: 14px 22px;
    border-bottom: 1px solid var(--line); background: transparent;
  }
  .brand { font-size: 17px; font-weight: 650; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .tb-nav { display: flex; gap: 6px; margin-left: auto; overflow-x: auto; }
  .tab-btn {
    flex: none; background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--dim); font: 600 13px system-ui; padding: 6px 16px; cursor: pointer;
    transition: all .15s;
  }
  .tab-btn:hover { color: var(--text); background: var(--panel2); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab-btn.live-here::after {
    content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--green); margin-left: 7px; vertical-align: 1px;
  }
  .chips { display: flex; gap: 6px; }
  .chip {
    flex: none; font-family: var(--mono); font-size: 10.5px; padding: 3px 8px;
    border-radius: 4px; border: 1px solid var(--line); color: var(--dim); letter-spacing: .05em;
    white-space: nowrap;
  }
  .chip.on { border-color: rgba(63,185,80,.45); color: var(--green); }
  .chip.warn { border-color: rgba(210,153,34,.5); color: var(--amber); }
  .chip.bad { border-color: rgba(248,81,73,.5); color: var(--red); }
  .chip a { color: inherit; text-decoration: none; }

  /* ---------- layout ---------- */
  /* The single row is pinned to the container height (minmax(0,1fr), never
     auto), so a tall feed or a tall panel scrolls INSIDE its column instead
     of growing the page past the viewport. main takes exactly the space the
     topbar leaves, measured by flex, never by a hardcoded pixel guess. */
  main { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(360px, 42%) 1fr; grid-template-rows: minmax(0, 1fr); }

  /* ---------- left: the feed ---------- */
  #chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; }
  #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
  .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; max-width: 94%; line-height: 1.55; font-size: 13px;
    animation: rise .18s ease-out; white-space: pre-wrap; word-break: break-word;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .bubble.user { align-self: flex-end; background: var(--panel2); }
  .bubble .who {
    display: flex; align-items: center; gap: 6px; font-family: var(--mono);
    font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 6px;
  }
  .bubble .who .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .bubble.speaking .who .dot { background: var(--accent); animation: pulse 1s infinite; }
  .bubble.answer { border-color: rgba(88,166,255,.45); background: linear-gradient(180deg, var(--accent-soft), var(--panel)); }
  .bubble.err { border-color: rgba(248,81,73,.5); }
  .bubble.err .who .dot { background: var(--red); }
  .caret { display: inline-block; width: 7px; height: 13px; background: var(--accent); vertical-align: -2px; animation: pulse .8s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* run header card in the feed */
  .runcard {
    border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px;
    background: var(--panel); padding: 8px 12px; font-family: var(--mono); font-size: 11px; color: var(--dim);
  }
  .runcard .t { color: var(--text); font-size: 12px; font-weight: 600; font-family: system-ui; }
  .runcard.autopilot { border-left-color: var(--violet); }
  .runcard.replay { border-left-color: var(--amber); }

  /* autopilot ribbon */
  #ribbon {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    border-top: 1px solid var(--line); background: var(--panel);
    font-family: var(--mono); font-size: 11px; color: var(--dim); min-height: 36px;
  }
  #ribbon .dotp { width: 8px; height: 8px; border-radius: 50%; background: var(--violet); flex: none; }
  #ribbon .dotp.idle { background: var(--line); }
  #ribbon .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ribbon .txt b { color: var(--text); font-weight: 600; }
  #ribbon button {
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    border-radius: 6px; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer;
  }
  #ribbon button:hover { border-color: var(--accent); }

  #approve { display: none; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  #approve.show { display: flex; }
  #approve button {
    flex: 1; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    border-radius: 6px; padding: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  #approve button.ok { border-color: rgba(63,185,80,.5); color: var(--green); }
  #approve button.no { border-color: rgba(248,81,73,.5); color: var(--red); }

  #composer { display: flex; gap: 8px; padding: 12px 14px 14px; border-top: 1px solid var(--line); align-items: center; }
  #target { font-family: var(--mono); font-size: 11px; color: var(--dim); flex: none; }
  #q {
    flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); padding: 10px 12px; font: 13px system-ui; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #06121f; border: 0; border-radius: 6px; padding: 9px 18px;
    font-weight: 600; font-size: 13px; cursor: pointer;
  }
  #send:disabled { opacity: .4; cursor: default; }

  /* ---------- right: the observatory ---------- */
  #obs { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  #stagebar {
    min-height: 36px; display: flex; align-items: center; gap: 10px; padding: 4px 14px;
    border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--dim);
    position: relative;
  }
  .pill {
    font-family: var(--mono); font-size: 10px; letter-spacing: .08em; padding: 2px 8px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--dim); text-transform: uppercase;
  }
  .pill.live { border-color: rgba(63,185,80,.55); color: var(--green); }
  .pill.replay { border-color: rgba(210,153,34,.55); color: var(--amber); }
  #stageTxt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #stageTxt .live { color: var(--accent); }
  #runCost { font-variant-numeric: tabular-nums; }
  #recentBtn, #browseBack {
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    border-radius: 6px; padding: 3px 10px; font: 600 11px system-ui; cursor: pointer;
  }
  #recentBtn:hover, #browseBack:hover { color: var(--text); border-color: var(--accent); }
  #browseBack { display: none; color: var(--accent); }
  #browseBack.show { display: block; }
  #recentPanel {
    display: none; position: absolute; top: 34px; right: 10px; z-index: 30; width: min(560px, 90%);
    max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.5);
  }
  #recentPanel.show { display: block; }
  .rrow {
    display: grid; grid-template-columns: 44px 66px 1fr 58px 58px; gap: 8px; align-items: center;
    padding: 6px 8px; border-radius: 6px; font-family: var(--mono); font-size: 11px; color: var(--dim); cursor: pointer;
  }
  .rrow:hover { background: var(--panel2); color: var(--text); }
  .rrow .src { text-transform: uppercase; font-size: 9.5px; letter-spacing: .06em; }
  .rrow .src.autopilot { color: var(--violet); }
  .rrow .q { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow .n { text-align: right; font-variant-numeric: tabular-nums; }
  .rrow .bad { color: var(--red); }

  #graphWrap { flex: 1.15; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px 0; overflow: auto; }
  #graphWrap svg { height: 100%; max-height: 100%; width: auto; max-width: 100%; }

  .node rect { fill: var(--panel); stroke: var(--line); stroke-width: 1.2; transition: all .25s; cursor: pointer; }
  .node text.lbl { fill: var(--dim); font: 600 12.5px system-ui; transition: fill .25s; pointer-events: none; }
  .node text.role { fill: var(--dim); opacity: .65; font: 9.5px var(--mono); pointer-events: none; }
  .node .status { fill: var(--dim); opacity: .5; transition: all .25s; }
  .node.active rect { stroke: var(--accent); fill: var(--panel2); filter: drop-shadow(0 0 9px rgba(88,166,255,.5)); }
  .node.active text.lbl { fill: var(--text); }
  .node.active .status { fill: var(--accent); opacity: 1; animation: pulse .9s infinite; }
  .node.done rect { stroke: var(--line); fill: var(--panel2); }
  .node.done .status { fill: var(--green); opacity: 1; }
  .node.done text.lbl { fill: var(--text); }
  .node.tooling rect { stroke: var(--amber); filter: drop-shadow(0 0 9px rgba(210,153,34,.45)); }
  .node.tooling .status { fill: var(--amber); opacity: 1; }
  .node.inspect rect { stroke: var(--violet); }

  .edge { stroke: var(--line); stroke-width: 1.4; fill: none; transition: stroke .25s; }
  .edge.active { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 6 5; animation: flow .5s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -11; } }
  .edge-lbl { fill: var(--dim); opacity: .7; font: 9.5px var(--mono); }
  marker path { fill: var(--line); }
  .node.endcap circle { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .node.endcap text { fill: var(--dim); font: 9.5px var(--mono); }
  .node.endcap.done circle { stroke: var(--green); fill: rgba(63,185,80,.12); }
  .node.endcap.done text { fill: var(--green); }

  /* ---------- right rail: subtabs + panels ---------- */
  #subtabs {
    display: flex; gap: 2px; padding: 0 10px; border-top: 1px solid var(--line);
    background: var(--panel); align-items: center;
  }
  .subtab {
    background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim);
    font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase;
    padding: 8px 12px; cursor: pointer;
  }
  .subtab:hover { color: var(--text); }
  .subtab.active { color: var(--text); border-bottom-color: var(--accent); }
  #panels { flex: 1 1 140px; min-height: 0; overflow-y: auto; }
  .panel { display: none; }
  .panel.show { display: block; }

  /* trace */
  .trow {
    display: grid; grid-template-columns: 14px 1fr 70px 62px 62px; gap: 8px; align-items: center;
    padding: 5px 14px; font-family: var(--mono); font-size: 11.5px; color: var(--dim);
    border-left: 2px solid transparent;
  }
  .trow.active { color: var(--text); border-left-color: var(--accent); background: var(--accent-soft); }
  .trow.done .st { color: var(--green); }
  .trow .st { font-size: 10px; }
  .trow .num { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
  .trow .tag { color: var(--dim); opacity: .8; font-size: 10px; text-align: right; }

  .tool {
    margin: 3px 14px 3px 28px; border: 1px solid var(--line); border-left: 2px solid var(--amber);
    border-radius: 5px; background: var(--panel); font-family: var(--mono); font-size: 11px;
  }
  .tool summary { padding: 5px 9px; cursor: pointer; color: var(--text); display: flex; align-items: center; gap: 8px; list-style: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary .nm { color: var(--amber); font-weight: 600; }
  .tool summary .arg { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .tool summary .ms { color: var(--dim); font-variant-numeric: tabular-nums; }
  .tool .body { border-top: 1px solid var(--line); padding: 7px 9px; }
  .tool .body .k { color: var(--dim); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; display: block; margin-bottom: 3px; }
  .tool .body pre { white-space: pre-wrap; word-break: break-word; color: var(--text); margin-bottom: 8px; max-height: 260px; overflow: auto; }
  .tool .body pre:last-child { margin-bottom: 0; }
  .tool.running { border-left-color: var(--accent); }
  .tool.running summary .nm { color: var(--accent); }

  /* state inspector */
  #statePanel { padding: 8px 14px; }
  .skey {
    display: grid; grid-template-columns: 130px 90px 1fr; gap: 10px; align-items: baseline;
    padding: 6px 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px;
  }
  .skey .k { color: var(--accent); font-weight: 600; }
  .skey .r { color: var(--dim); font-size: 10px; }
  .skey .r.append { color: var(--violet); }
  .skey .v { color: var(--text); white-space: pre-wrap; word-break: break-word; max-height: 90px; overflow-y: auto; }
  .skey .v .wb { color: var(--dim); font-size: 10px; }
  .shint { color: var(--dim); font-size: 12px; padding: 12px 8px; line-height: 1.6; }

  /* checkpoints */
  #ckptPanel { padding: 8px 14px; }
  .ckpt {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center;
    padding: 6px 8px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--dim);
  }
  .ckpt .step { color: var(--text); font-weight: 600; }
  .ckpt button {
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    border-radius: 5px; padding: 3px 9px; font: 600 10.5px system-ui; cursor: pointer;
  }
  .ckpt button:hover { border-color: var(--violet); color: var(--violet); }

  /* x-ray */
  #xrayPanel { padding: 12px 14px; }
  .xcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .xcard h3 { font-size: 13px; margin-bottom: 6px; }
  .xcard h4 { font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 10px 0 4px; }
  .xcard p { font-size: 12.5px; color: var(--text); line-height: 1.6; }
  .xcard li { font-size: 12.5px; color: var(--text); line-height: 1.6; margin: 6px 0 6px 16px; }
  .fw { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
  .fw .a { font-family: var(--mono); font-size: 11px; color: var(--violet); white-space: nowrap; }
  .fw .n { font-size: 12px; color: var(--dim); }

  /* stats strip */
  #stats {
    display: flex; gap: 18px; padding: 7px 14px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--dim); flex-wrap: wrap;
  }
  #stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* tab level badge */
  .tab-btn .lvl {
    display: inline-block; min-width: 15px; height: 15px; line-height: 15px;
    border-radius: 50%; background: var(--panel2); color: var(--dim);
    font: 700 9.5px var(--mono); text-align: center; margin-right: 7px; vertical-align: 1px;
  }
  .tab-btn.active .lvl { background: rgba(255,255,255,.22); color: #fff; }

  /* the complexity ladder (default x-ray view) */
  .rung {
    display: grid; grid-template-columns: 30px 120px 1fr; gap: 12px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 14px; margin-bottom: 8px; cursor: pointer; transition: border-color .15s;
    animation: rise .25s ease-out both;
  }
  .rung:nth-child(2) { animation-delay: .03s } .rung:nth-child(3) { animation-delay: .06s }
  .rung:nth-child(4) { animation-delay: .09s } .rung:nth-child(5) { animation-delay: .12s }
  .rung:nth-child(6) { animation-delay: .15s } .rung:nth-child(7) { animation-delay: .18s }
  .rung:hover { border-color: var(--accent); }
  .rung.here { border-color: var(--violet); }
  .rung .ln {
    width: 26px; height: 26px; border-radius: 50%; background: var(--panel2);
    border: 1px solid var(--line); color: var(--text); font: 700 12px var(--mono);
    display: flex; align-items: center; justify-content: center;
  }
  .rung.here .ln { background: linear-gradient(135deg, var(--accent), var(--violet)); border: 0; color: #fff; }
  .rung .nm { font-weight: 600; font-size: 13px; }
  .rung .nm small { display: block; color: var(--dim); font: 10.5px var(--mono); margin-top: 2px; }
  .rung .why { color: var(--dim); font-size: 12px; line-height: 1.45; }
  .rung .why b { color: var(--text); font-weight: 600; }

  /* blueprint: the build() source + what LangGraph compiled */
  #bpPanel { padding: 12px 14px; }
  .bp-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .bp-meta span {
    border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
    padding: 3px 10px; font: 10.5px var(--mono); color: var(--dim);
  }
  .bp-meta span b { color: var(--text); font-weight: 600; }
  .bp-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .bp-topo { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .bp-topo h4, .bp-srcwrap h4 {
    font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 8px;
  }
  .bp-topo .edge-row { font: 11.5px var(--mono); color: var(--dim); padding: 2px 0; }
  .bp-topo .edge-row b { color: var(--text); font-weight: 600; }
  .bp-topo .edge-row .cond { color: var(--violet); }
  .bp-srcwrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 4px 12px 14px; }
  .bp-src { overflow: auto; max-height: 52vh; font: 11.5px var(--mono); line-height: 1.6; counter-reset: ln; }
  .bp-src .cl { white-space: pre; display: block; }
  .bp-src .cl::before {
    counter-increment: ln; content: counter(ln);
    display: inline-block; width: 30px; color: #3d4450; text-align: right; margin-right: 14px;
  }
  .tok-k { color: var(--violet); }
  .tok-s { color: var(--green); }
  .tok-c { color: #6a737d; font-style: italic; }
  .tok-f { color: var(--amber); }
  .tok-n { color: var(--accent); font-weight: 600; }

  /* markdown in the feed. Bubbles are pre-wrap for plain text; rendered
     markdown must opt back out or every block boundary doubles its gap. */
  .bubble .md { display: block; white-space: normal; }
  .bubble .md h1, .bubble .md h2, .bubble .md h3, .bubble .md h4 {
    font-size: 13.5px; margin: 10px 0 4px; color: var(--text);
  }
  .bubble .md h1 { font-size: 14.5px; }
  .bubble .md p { margin: 6px 0; }
  .bubble .md code { font-family: var(--mono); font-size: 11.5px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
  .bubble .md pre.md-code {
    background: #10151d; border: 1px solid var(--line); border-radius: 6px;
    padding: 9px 11px; margin: 8px 0; overflow-x: auto;
    font: 11.5px var(--mono); line-height: 1.55; white-space: pre;
  }
  .bubble .md pre.md-code code { background: none; border: 0; padding: 0; }
  .bubble .md ul, .bubble .md ol { margin: 6px 0 6px 20px; }
  .bubble .md li { margin: 3px 0; }
  .bubble .md table.md-table { border-collapse: collapse; margin: 8px 0; font-size: 12px; }
  .bubble .md .md-table th, .bubble .md .md-table td {
    border: 1px solid var(--line); padding: 4px 9px; text-align: left;
  }
  .bubble .md .md-table th { background: var(--panel2); font-weight: 600; }
  .bubble .md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--dim); margin: 6px 0; }
  .bubble .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .bubble .md a { color: var(--accent); }

  /* the memo, as a document instead of raw JSON */
  .memo { display: grid; grid-template-columns: 92px 1fr; gap: 4px 12px; margin-top: 4px; }
  .memo .mk { font: 600 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding-top: 2px; }
  .memo .mv { font-size: 12.5px; }
  .memo .mv .lvl-pill {
    display: inline-block; border: 1px solid rgba(188,140,255,.5); color: var(--violet);
    border-radius: 999px; padding: 1px 9px; font: 600 11px var(--mono); margin-right: 6px;
  }
  .memo .mv li { margin-left: 16px; }

  /* motion: numbers pop when they change, state rows flash when written */
  @keyframes statpop { 0% { transform: scale(1); } 35% { transform: scale(1.18); color: var(--accent); } 100% { transform: scale(1); } }
  #stats b.pop { display: inline-block; animation: statpop .5s ease-out; }
  @keyframes rowflash { from { background: var(--accent-soft); } to { background: transparent; } }
  .skey.flash { animation: rowflash 1.1s ease-out; }
  .ckpt { animation: rise .2s ease-out both; }
  @keyframes dotpop { 0% { r: 3.5; } 45% { r: 6; } 100% { r: 3.5; } }
  .node.done .status { animation: dotpop .45s ease-out; }
  #apDot:not(.idle) { animation: pulse 1.6s infinite; }

  /* desk lane + voice card (unchanged behavior) */
  #deskList { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .desk-empty { color: var(--dim); font-size: 13px; line-height: 1.6; padding: 12px 4px; }
  .desk-empty a { color: var(--accent); }
  .desk-hint { color: var(--dim); font-family: var(--mono); font-size: 11px; }
  .drun {
    display: grid; grid-template-columns: 52px 46px 1fr 12px 44px 58px; gap: 8px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-family: var(--mono); font-size: 11.5px; color: var(--dim);
    cursor: pointer; transition: all .15s;
  }
  .drun:hover { border-color: var(--dim); color: var(--text); }
  .drun.sel { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .drun .tick { color: var(--text); font-weight: 600; }
  .drun .vchip {
    justify-self: start; border: 1px solid var(--line); border-radius: 4px;
    padding: 2px 6px; font-size: 10px; letter-spacing: .05em; color: var(--amber);
    border-color: rgba(210,153,34,.5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%;
  }
  .drun .adot { width: 8px; height: 8px; border-radius: 50%; background: var(--panel2); border: 1px solid var(--line); }
  .drun .adot.on { background: var(--green); border-color: var(--green); }
  .drun .oc.bad { color: var(--red); }
  .drun .lat { text-align: right; font-variant-numeric: tabular-nums; }
  #deskOrder { display: none; align-items: flex-start; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); background: var(--panel); }
  #deskOrder.show { display: flex; }
  #deskOrder .k { font: 600 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-top: 3px; }
  #deskOrder .line { flex: 1; font-family: var(--mono); font-size: 14.5px; line-height: 1.5; color: var(--text); word-break: break-word; user-select: all; }
  #deskOrder button {
    flex: none; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    border-radius: 6px; padding: 6px 12px; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  #deskOrder button:hover { border-color: var(--accent); }
  #voiceCard { padding: 22px; color: var(--dim); font-size: 13px; line-height: 1.6; max-width: 620px; }
  #voiceCard h3 { color: var(--text); font-size: 15px; margin-bottom: 8px; }
  #voiceCard code { font-family: var(--mono); color: var(--accent); font-size: 12px; }
  #voiceCard .tools { margin-top: 12px; font-family: var(--mono); font-size: 11.5px; }
  #voiceCard .tools span { display: inline-block; border: 1px solid var(--line); background: var(--panel);
    border-radius: 4px; padding: 3px 7px; margin: 0 5px 5px 0; color: var(--text); }
  .hide { display: none !important; }
</style>
</head>
<body>
<!-- Estate bar: same tabs + sign-in state as every other b4rruf3t app. -->
<script src="https://auth.b4rruf3t.com/eco-nav.js" defer></script>
<nav class="topbar">
  <div class="brand">agent <span>observatory</span></div>
  <div class="tb-nav" id="tabs"></div>
  <div class="chips">
    <div class="chip" id="chipLlm">...</div>
    <div class="chip" id="chipLs">langsmith</div>
    <div class="chip" id="chipSpend">$0.00 today</div>
    <div class="chip" id="chipWatch">· watching</div>
  </div>
</nav>

<main>
  <section id="chat">
    <div id="messages"></div>
    <div id="deskList" class="hide"></div>
    <div id="ribbon">
      <span class="dotp idle" id="apDot"></span>
      <span class="txt" id="apTxt">autopilot warming up</span>
      <button id="apNow" class="hide">run now</button>
    </div>
    <div id="approve">
      <button class="ok" data-action="approve">approve</button>
      <button data-action="revise">revise</button>
      <button class="no" data-action="reject">reject</button>
    </div>
    <div id="composer">
      <span id="target"></span>
      <input id="q" placeholder="take the stage: ask this agent something" />
      <button id="send">run</button>
    </div>
  </section>

  <section id="obs">
    <div id="stagebar">
      <span class="pill" id="stagePill">idle</span>
      <span id="stageTxt">connecting</span>
      <span id="runCost"></span>
      <button id="browseBack">back to the live run</button>
      <button id="recentBtn">recent</button>
      <div id="recentPanel"></div>
    </div>
    <div id="graphWrap"></div>
    <div id="voiceCard" class="hide"></div>
    <div id="deskOrder"></div>
    <div id="subtabs">
      <button class="subtab active" data-panel="tracePanel">trace</button>
      <button class="subtab" data-panel="statePanel">state</button>
      <button class="subtab" data-panel="ckptPanel">checkpoints</button>
      <button class="subtab" data-panel="xrayPanel">x-ray</button>
      <button class="subtab" data-panel="bpPanel">blueprint</button>
    </div>
    <div id="panels">
      <div class="panel show" id="tracePanel"><div id="trows"></div></div>
      <div class="panel" id="statePanel"></div>
      <div class="panel" id="ckptPanel"></div>
      <div class="panel" id="xrayPanel"></div>
      <div class="panel" id="bpPanel"></div>
    </div>
    <div id="stats"></div>
  </section>
</main>

<script src="/layout.js"></script>
<script src="/md.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const messages = $("#messages"), trows = $("#trows");

/* ------------------------------------------------------------------ state */
let AGENTS = [], SPECS = {};              // registry
let VIEW = null;                          // agent id currently drawn on the right
let RUN = null;                           // meta of the run on stage (live)
let RUN_AGENT = null;                     // agent id of the live run
let browsing = false;                     // reading another agent mid-run
let composeTarget = null;                 // user-chosen agent for the composer
let pendingThread = null, pendingAgent = null, approveTimer = null;
let bubbles = {}, traceRows = {}, runCount = {}, tools = {};
let activeNodes = new Set(), doneNodes = new Set();
let stateVals = {};                       // state inspector accumulator
let ckpts = null;                         // latest checkpoints frame
let runCost = 0, runToks = 0;
let replaySeq = 0, REPLAYING = false;     // archived replay control
let apStatus = {};                        // last autopilot frame
let deskRuns = [], deskSel = null, deskTimer = null, deskReplay = 0;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function escapeHtml(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }
function scrollChat() { messages.scrollTop = messages.scrollHeight; }
function agentOf(id) { return AGENTS.find((a) => a.id === id); }
function fmtUsd(v) { return "$" + (Number(v) || 0).toFixed(v >= 1 ? 2 : 4); }

/* ------------------------------------------------------------------- boot */
async function init() {
  const data = await (await fetch("/api/agents")).json();
  AGENTS = data.agents;
  for (const a of AGENTS) if (a.spec) SPECS[a.id] = a.spec;
  setMode(data.mode);
  const tabs = $("#tabs");
  for (const a of AGENTS) {
    const badge = a.level ? `<span class="lvl">${a.level}</span>` : "";
    const b = el("button", "tab-btn", badge + escapeHtml(a.label));
    b.title = a.arrangement ? `${a.arrangement} · ${a.tagline}` : a.tagline;
    b.dataset.id = a.id;
    b.addEventListener("click", () => userSelect(a.id));
    tabs.appendChild(b);
  }
  renderView(data.default);
  connectLive();
  refreshStats();
  setInterval(refreshStats, 60000);
  setInterval(tick, 500);
}

/* --------------------------------------------------------- view switching */
function renderView(id, keepRunState) {
  const a = agentOf(id);
  if (!a) return;
  VIEW = id;
  document.querySelectorAll(".tab-btn").forEach((b) =>
    b.classList.toggle("active", b.dataset.id === id));
  stopDesk();
  const isVoice = a.kind === "voice", isDesk = a.kind === "desk";
  $("#graphWrap").classList.toggle("hide", isVoice);
  $("#voiceCard").classList.toggle("hide", !isVoice);
  $("#composer").classList.toggle("hide", isVoice || isDesk);
  $("#subtabs").classList.toggle("hide", isVoice || isDesk);
  $("#panels").classList.toggle("hide", isVoice);
  $("#messages").classList.toggle("hide", isDesk);
  $("#deskList").classList.toggle("hide", !isDesk);
  $("#ribbon").classList.toggle("hide", isVoice || isDesk);
  if (isDesk) { startDesk(); return; }
  if (isVoice) { renderVoice(a); return; }
  $("#graphWrap").innerHTML = ObsLayout.renderSvg(SPECS[id], { direction: "TB" });
  wireNodeClicks();
  renderXray(null);
  renderStatePanel();
  renderCkpts();
  loadBlueprint(id);
  if (keepRunState && id === RUN_AGENT) {
    doneNodes.forEach((n) => nodeEl(n)?.classList.add("done"));
    activeNodes.forEach((n) => nodeEl(n)?.classList.add("active"));
  }
  updateTargetLabel();
}

function userSelect(id) {
  composeTarget = id;
  if (RUN && id !== RUN_AGENT) {
    browsing = true;
    $("#browseBack").classList.add("show");
  } else {
    browsing = false;
    $("#browseBack").classList.remove("show");
    if (RUN) composeTarget = null;      // back on the live agent: follow again
  }
  renderView(id, true);
}

$("#browseBack").addEventListener("click", () => {
  browsing = false;
  $("#browseBack").classList.remove("show");
  if (RUN_AGENT) renderView(RUN_AGENT, true);
});

function followStage(agentId) {
  const tab = document.querySelector(`.tab-btn[data-id="${agentId}"]`);
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("live-here"));
  tab?.classList.add("live-here");
  if (browsing) return;
  renderView(agentId, false);
}

function updateTargetLabel() {
  const t = composeTarget || VIEW;
  $("#target").textContent = "→ " + t;
  const a = agentOf(t);
  if (a?.placeholder) $("#q").placeholder = a.placeholder;
}

/* ----------------------------------------------------------- live channel */
function connectLive() {
  const es = new EventSource("/api/live");
  es.onmessage = (e) => {
    let ev;
    try { ev = JSON.parse(e.data); } catch { return; }
    HANDLERS[ev.type]?.(ev);
  };
  // EventSource reconnects on its own; the server re-sends hello + snapshot.
}

/* -------------------------------------------------------------- handlers */
function onHello(ev) {
  setMode(ev.mode || {});
  if (ev.stats) renderStats(ev.stats, ev.spend);
  if (ev.stage) {
    // A run is mid-flight: the buffered frames that follow rebuild it.
    prepareRun(ev.stage);
  } else {
    RUN = null; RUN_AGENT = null;
    setPill("idle");
    $("#stageTxt").textContent = "stage idle";
    loadLatestReplay();               // never a dead screen on arrival
  }
  if (ev.pending_interrupt) showApprove(ev.pending_interrupt);
}

function prepareRun(meta) {
  replaySeq++; REPLAYING = false;     // live always wins over a replay
  RUN = meta; RUN_AGENT = meta.agent_id;
  resetRunViews();
  followStage(meta.agent_id);
  setPill("live");
  const src = meta.source === "autopilot" ? "autopilot" : meta.source;
  $("#stageTxt").innerHTML =
    `<span class="live">● ${escapeHtml(meta.agent_id)}</span>` +
    `&nbsp; ${escapeHtml(meta.title || meta.question || "")} &nbsp;· ${escapeHtml(src)}`;
  addRunCard(meta);
  $("#approve").classList.remove("show");
}

function onStage(ev) {
  if (ev.state === "running") { prepareRun(ev); return; }
  if (ev.state === "idle") {
    RUN = null; RUN_AGENT = null;
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("live-here"));
    setPill("idle");
    if (ev.stats) renderStats(ev.stats, ev.spend);
    $("#stageTxt").textContent = "stage idle · autopilot lining up the next run";
  }
}

function onRunStart(ev) {
  setMode(ev.mode || {});
  if (ev.replay_from) addBubble("observatory",
    "re-running this thread from a saved checkpoint: everything before it is replayed state, everything after is fresh execution", "answer");
}

function setPill(kind) {
  const p = $("#stagePill");
  p.className = "pill" + (kind === "live" ? " live" : kind === "replay" ? " replay" : "");
  p.textContent = kind;
}

function addRunCard(meta) {
  const cls = meta.source === "autopilot" ? " autopilot" : meta.source === "replay" ? " replay" : "";
  const card = el("div", "runcard" + cls);
  const what = meta.title ? `${escapeHtml(meta.title)}` : "visitor question";
  card.innerHTML = `<div class="t">${what}</div>` +
    `${escapeHtml(meta.agent_id)} · ${escapeHtml(meta.source)}` +
    (meta.question && meta.source !== "visitor" ? `<br>“${escapeHtml(meta.question)}”` : "");
  messages.appendChild(card); scrollChat();
}

/* node + token + tool handlers: the live DAG */
function nodeEl(id) { return VIEW === RUN_AGENT || REPLAYING ? document.getElementById("n-" + id) : null; }
function specOf() { return SPECS[RUN_AGENT] || { nodes: [], edges: [] }; }
function labelOf(id) { return (specOf().nodes || []).find((n) => n.id === id)?.label || id; }

function onNodeStart(ev) {
  const id = ev.node;
  runCount[id] = (runCount[id] || 0) + 1;
  activeNodes.add(id);
  const n = nodeEl(id);
  if (n) { n.classList.remove("done"); n.classList.add("active"); }
  (specOf().edges || []).filter((e) => e.to === id)
    .forEach((e) => document.getElementById("e-" + e.from + "-" + e.to)?.classList.add("active"));

  const rev = runCount[id] > 1 ? ` · pass ${runCount[id]}` : "";
  const b = el("div", "bubble speaking");
  b.innerHTML = `<div class="who"><span class="dot"></span>${escapeHtml(labelOf(id))}${rev}</div>` +
    `<span class="txt"></span><span class="caret"></span>`;
  messages.appendChild(b); scrollChat();
  bubbles[id] = b;

  const row = el("div", "trow active");
  row.innerHTML = `<span class="st">&#9654;</span><span>${escapeHtml(id)}${rev}</span>
    <span class="num tok">0 tok</span><span class="num ms">...</span><span class="tag">running</span>`;
  trows.appendChild(row);
  traceRows[id] = { row, t0: performance.now(), tokens: 0 };
  if ($("#tracePanel").classList.contains("show")) row.scrollIntoView({ block: "nearest" });
}

function onToken(ev) {
  const b = bubbles[ev.node];
  if (b) {
    // Markdown renders WHILE the model speaks, throttled so a token flood
    // costs one re-render per beat, never one per token. A long researcher
    // node must read formatted the whole way, not only after it finishes.
    b._raw = (b._raw || "") + ev.text;
    if (!b._mdTimer) {
      b._mdTimer = setTimeout(() => {
        b._mdTimer = null;
        const t = b.querySelector(".txt");
        if (t) { t.classList.add("md"); t.innerHTML = ObsMd.render(b._raw); }
        scrollChat();
      }, 140);
    }
  }
  const tr = traceRows[ev.node];
  if (tr) { tr.tokens++; tr.row.querySelector(".tok").textContent = tr.tokens + " tok"; }
}

function onNodeEnd(ev) {
  const id = ev.node;
  activeNodes.delete(id); doneNodes.add(id);
  const n = nodeEl(id);
  if (n) { n.classList.remove("active", "tooling"); n.classList.add("done"); }
  (specOf().edges || []).filter((e) => e.to === id)
    .forEach((e) => document.getElementById("e-" + e.from + "-" + e.to)?.classList.remove("active"));
  const b = bubbles[id];
  if (b) {
    b.classList.remove("speaking");
    b.querySelector(".caret")?.remove();
    if (b._mdTimer) { clearTimeout(b._mdTimer); b._mdTimer = null; }
    const raw = (b._raw || "").trim();
    if (!raw) b.remove();
    else {
      const t = b.querySelector(".txt");
      t.classList.add("md");
      t.innerHTML = ObsMd.render(raw);
    }
  }
  const tr = traceRows[id];
  if (tr) {
    tr.row.className = "trow done";
    tr.row.querySelector(".st").innerHTML = "&#10003;";
    tr.row.querySelector(".ms").textContent = Math.round(performance.now() - tr.t0) + " ms";
    tr.row.querySelector(".tag").textContent = "done";
  }
  if (ev.update) {
    for (const [k, v] of Object.entries(ev.update)) stateVals[k] = { value: v, node: id };
    renderStatePanel();
    for (const k of Object.keys(ev.update))
      document.querySelector(`#statePanel .skey[data-key="${CSS.escape(k)}"]`)
        ?.classList.add("flash");
  }
}

function onToolStart(ev) {
  nodeEl(ev.node)?.classList.add("tooling");
  const d = el("details", "tool running");
  const args = ObsMd.pretty(ev.args ?? "");
  d.innerHTML =
    `<summary><span class="nm">${escapeHtml(ev.tool)}</span>` +
    `<span class="arg">${escapeHtml(args)}</span><span class="ms">...</span></summary>` +
    `<div class="body"><span class="k">arguments</span><pre></pre>` +
    `<span class="k">result</span><pre class="out">running...</pre></div>`;
  d.querySelector(".body pre").textContent = args;
  trows.appendChild(d);
  tools[ev.id] = d;
  if ($("#tracePanel").classList.contains("show")) d.scrollIntoView({ block: "nearest" });
}

function onToolEnd(ev) {
  nodeEl(ev.node)?.classList.remove("tooling");
  const d = tools[ev.id];
  if (!d) return;
  d.classList.remove("running");
  d.querySelector(".ms").textContent = ev.ms == null ? "" : ev.ms + " ms";
  d.querySelector(".out").textContent = ObsMd.pretty(ev.output ?? "");
}

function onRoute(ev) {
  const e = document.getElementById("e-" + ev.from + "-" + ev.to);
  if (e) { e.classList.add("active"); setTimeout(() => e.classList.remove("active"), 1600); }
  if (ev.to === "end") document.getElementById("endcap")?.classList.add("done");
  trows.appendChild(el("div", "trow done",
    `<span class="st">&#8618;</span><span>route ${escapeHtml(ev.from)} &rarr; ${escapeHtml(ev.to)}</span>
     <span></span><span></span><span class="tag">${escapeHtml(ev.decision || "")}</span>`));
}

function onUsage(ev) {
  if (REPLAYING) return;                 // archived spend is already banked
  runCost += Number(ev.cost_usd) || 0;
  runToks += (Number(ev.input_tokens) || 0) + (Number(ev.output_tokens) || 0);
  $("#runCost").textContent = `this run ${fmtUsd(runCost)} · ${runToks.toLocaleString()} tok`;
  trows.appendChild(el("div", "trow done",
    `<span class="st">$</span><span>model call · ${escapeHtml(ev.model || "")}</span>
     <span class="num">${(Number(ev.input_tokens) || 0) + (Number(ev.output_tokens) || 0)} tok</span>
     <span class="num">${fmtUsd(ev.cost_usd)}</span><span class="tag">banked</span>`));
}

function onCheckpoints(ev) {
  ckpts = ev;
  renderCkpts();
}

function onInterrupt(ev) {
  showApprove(ev);
  const memo = ev.payload?.memo ?? ev.payload;
  const b = addBubble("approval gate · interrupt()", "", "answer");
  b.appendChild(memoEl(memo));
  scrollChat();
  setPill("idle");
  $("#stageTxt").innerHTML =
    `<span class="live">parked at the human gate</span>&nbsp; the graph is checkpointed and waiting`;
}

/* The memo as a document. Raw JSON braces are for machines; the whole point
   of a typed schema is that the UI can lay the fields out like a memo. */
function memoEl(memo) {
  const wrap = el("div", "memo");
  if (!memo || typeof memo !== "object") {
    wrap.textContent = ObsMd.pretty(String(memo ?? ""));
    return wrap;
  }
  const order = ["bias", "conviction", "thesis", "trade_idea", "key_levels",
                 "invalidation", "risks"];
  const keys = [...order.filter((k) => k in memo),
                ...Object.keys(memo).filter((k) => !order.includes(k))];
  for (const k of keys) {
    const v = memo[k];
    wrap.appendChild(el("div", "mk", escapeHtml(k.replace(/_/g, " "))));
    const cell = el("div", "mv");
    if (k === "conviction") {
      cell.innerHTML = `<span class="lvl-pill">${escapeHtml(String(v))} / 10</span>`;
    } else if (Array.isArray(v)) {
      const ul = el("ul");
      v.forEach((item) => ul.appendChild(el("li", "", escapeHtml(String(item)))));
      cell.appendChild(ul);
    } else {
      cell.textContent = String(v ?? "");
    }
    wrap.appendChild(cell);
  }
  return wrap;
}

function showApprove(p) {
  pendingThread = p.thread;
  pendingAgent = p.agent || RUN_AGENT || "analyst";
  $("#approve").classList.add("show");
  clearInterval(approveTimer);
  const okBtn = $("#approve button.ok");
  if (p.auto_approve_at) {
    approveTimer = setInterval(() => {
      const left = Math.max(0, Math.ceil(p.auto_approve_at - Date.now() / 1000));
      okBtn.textContent = left > 0 ? `approve (observatory approves in ${left}s)` : "approve";
      if (left <= 0) clearInterval(approveTimer);
    }, 250);
  } else {
    okBtn.textContent = "approve";
  }
}

function onRunEnd(ev) {
  document.getElementById("endcap")?.classList.add("done");
  if (ev.note) { addBubble("observatory", ev.note); return; }
  const b = addBubble("final answer", "", "answer");
  const body = el("div", "md");
  body.innerHTML = ObsMd.render(ev.answer || "(empty)");
  b.appendChild(body);
  scrollChat();
}

function onTrace(ev) {
  const chip = $("#chipLs");
  chip.innerHTML = `<a href="${escapeHtml(ev.url)}" target="_blank" rel="noopener">langsmith trace ↗</a>`;
  chip.className = "chip on";
}

function onAutopilot(ev) {
  apStatus = ev;
  $("#chipWatch").textContent = `${ev.viewers ?? "·"} watching`;
  renderRibbon();
}

function onError(ev) {
  addBubble("error", ev.message, "err");
  setPill("idle");
}

const HANDLERS = {
  hello: onHello,
  stage: onStage,

function renderRibbon() {
  const s = apStatus || {};
  const dot = $("#apDot"), txt = $("#apTxt"), now = $("#apNow");
  now.classList.add("hide");
  dot.className = "dotp";
  if (!s.enabled) { dot.classList.add("idle"); txt.textContent = "autopilot off · the composer below is all yours"; return; }
  const rung = s.level ? `level ${s.level} of ${s.ladder_top || 6} · ` : "";
  if (s.state === "countdown") {
    const left = Math.max(0, Math.ceil((s.next_at || 0) - Date.now() / 1000));
    txt.innerHTML = `next: ${rung}<b>${escapeHtml(s.title || "")}</b> on ${escapeHtml(s.agent || "")} in ${left}s · ${escapeHtml(s.shows || "")}`;
    now.classList.remove("hide");

    txt.innerHTML = `running ${rung}<b>${escapeHtml(s.title || "")}</b> · ${escapeHtml(s.shows || "")}`;
  } else if (s.state === "resting") {
    txt.textContent = "autopilot resting: the spend guard asked for a pause";
  } else if (s.state === "empty_room") {
    txt.textContent = "autopilot ready · runs start when the room has viewers";
  } else if (s.state === "off") {
    dot.classList.add("idle"); txt.textContent = "autopilot off";

async function postChat(agent, question, echoTitle) {
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ agent, question }),
    });
    if (!r.ok) {
      const detail = (await r.json().catch(() => ({}))).detail || `stage returned ${r.status}`;
      addBubble("stage", detail, "err");
      return;
    }
    browsing = false;
    $("#browseBack").classList.remove("show");
    addBubble("you" + (echoTitle ? ` · ${echoTitle}` : ""), question, "user");
  } catch (err) {
    addBubble("error", String(err), "err");
  }
}

function run() {
  const q = $("#q").value.trim();
  const target = composeTarget || VIEW;
  const a = agentOf(target);
  if (!q || !a || a.kind !== "text") return;
  $("#q").value = "";
  postChat(target, q);
}

    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ agent: pendingAgent, thread: pendingThread, action, notes }),

  if (!r.ok) {

});

const BP = {};                              // agent id -> fetched blueprint

async function loadBlueprint(agentId) {
  const a = agentOf(agentId);
  if (!a || a.kind !== "text") return;
  if (!BP[agentId]) {
    try { BP[agentId] = await (await fetch("/api/blueprint?agent=" + agentId)).json(); }
    catch { return; }
  }
  if (VIEW === agentId) renderBlueprint(BP[agentId]);

const PY_KEYWORDS = /\b(def|return|async|await|from|import|class|for|in|if|elif|else|not|and|or|None|True|False|lambda|with|try|except|finally|raise|yield|global|nonlocal)\b/g;
const FRAMEWORK_NAMES = /\b(StateGraph|START|END|InMemorySaver|Command|interrupt|ToolNode|create_agent|add_node|add_edge|add_conditional_edges|compile|with_structured_output|bind_tools|checkpointer|ainvoke|astream_events)\b/g;

/* Escape first, then colorize. Later passes only touch text OUTSIDE spans
   already inserted, so string contents never get keyword colors and nothing
   the model or the source says can smuggle markup in. */
function outsideSpans(html, fn) {
  return html.split(/(<span[^>]*>.*?<\/span>)/g)
    .map((part) => part.startsWith("<span") ? part : fn(part)).join("");
}

function hiLine(line, nodeIds) {
  let h = escapeHtml(line).replace(/"/g, "&quot;");
  if (/^\s*#/.test(line)) return `<span class="tok-c">${h}</span>`;
  h = h.replace(/(&quot;|&#39;|')((?:[^&']|&(?!quot;)|\\.)*?)\1/g, (m, q, inner) =>
    `<span class="${nodeIds.has(inner) ? "tok-n" : "tok-s"}">${m}</span>`);
  h = outsideSpans(h, (t) => t.replace(PY_KEYWORDS, '<span class="tok-k">$1</span>'));
  h = outsideSpans(h, (t) => t.replace(FRAMEWORK_NAMES, '<span class="tok-f">$1</span>'));
  return h;
}

function renderBlueprint(bp) {
  const panel = $("#bpPanel");
  if (!bp) { panel.innerHTML = `<div class="shint">no blueprint for this view</div>`; return; }
  const nodeIds = new Set(((SPECS[bp.agent] || {}).nodes || []).map((n) => n.id));

  const meta =
    `<div class="bp-meta">` +
    (bp.level ? `<span>rung <b>${bp.level}</b> · ${escapeHtml(bp.arrangement || "")}</span>` : "") +
    `<span>checkpointer <b>${escapeHtml(bp.checkpointer || "none")}</b></span>` +
    `<span>streaming <b>${escapeHtml(bp.runtime?.streaming || "")}</b></span>` +
    `<span>recursion_limit <b>${bp.runtime?.recursion_limit ?? ""}</b></span></div>`;

  const edges = (bp.compiled?.edges || []).map((e) =>
    `<div class="edge-row"><b>${escapeHtml(e.from)}</b> &rarr; <b>${escapeHtml(e.to)}</b>` +
    (e.conditional ? ` <span class="cond">conditional</span>` : "") + `</div>`).join("");
  const topo = edges
    ? `<div class="bp-topo"><h4>what LangGraph compiled · from get_graph(), so it cannot lie</h4>${edges}</div>`
    : `<div class="bp-topo"><h4>what LangGraph compiled</h4><div class="edge-row">not compiled in this mode; the wiring below is still the real source</div></div>`;

  const srcLines = (bp.source || "").split("\n");
  const src = srcLines.map((line) =>
    `<span class="cl">${hiLine(line, nodeIds) || " "}</span>`).join("");
  // sql and repo declare their whole loop through create_agent, so their
  // source is a few honest lines; say so instead of over-promising wiring.
  const prebuilt = srcLines.length < 9 && (bp.source || "").includes("create_agent");
  const srcTitle = prebuilt
    ? "build(): short on purpose · create_agent IS the wiring, the prebuilt tool loop compiled into the topology above"
    : "build(): the function that wires this graph · read straight off the module";

  panel.innerHTML = meta +
    `<div class="bp-cols">${topo}` +
    `<div class="bp-srcwrap"><h4>${srcTitle}</h4>` +
    `<div class="bp-src">${src}</div></div></div>`;
}

const REPLAY_PACE = { node_start: 200, node_end: 110, tool_start: 170, tool_end: 110, route: 200, interrupt: 250, usage: 40 };

async function replayArchived(run) {
  const my = ++replaySeq;
  REPLAYING = true;
  RUN = null; RUN_AGENT = run.agent_id;
  resetRunViews();
  renderView(run.agent_id, false);
  setPill("replay");
  $("#stageTxt").innerHTML =
    `replaying run #${run.id} · ${escapeHtml(run.agent_id)} · ${escapeHtml(run.started_at || "")}` +
    (run.trace_url ? ` · <a style="color:var(--accent)" href="${escapeHtml(run.trace_url)}" target="_blank" rel="noopener">trace ↗</a>` : "");
  addRunCard({ ...run, source: "replay", title: run.title || run.question });
  let tokens = 0;
  for (const frame of run.frames || []) {
    if (my !== replaySeq) return;        // superseded by a live run or click
    HANDLERS[frame.type]?.(frame);
    if (frame.type === "token") { if (++tokens % 24 === 0) await sleep(8); }
    else await sleep(REPLAY_PACE[frame.type] ?? 0);
  }
  if (my === replaySeq) REPLAYING = false;
}

  let data;

  catch { return; }
  if (agentOf(VIEW)?.kind !== "desk") return;
  const runs = data.runs || [];

function deskSpec(rec) {
  const nodes = rec.nodes || [];
  const s = rec.spec && (rec.spec.nodes || []).length ? rec.spec : {
    nodes: nodes.map((n) => ({ id: n.node, label: n.node })),
    edges: nodes.slice(1).map((n, i) => [nodes[i].node, n.node]),
  };
  return {
    nodes: (s.nodes || []).map((n) => typeof n === "string" ? { id: n }
      : { id: n.id, label: n.label || n.id, role: n.hint || "" }),
    edges: (s.edges || []).map((e) => Array.isArray(e)
      ? { from: e[0], to: e[1] } : e),
  };
}

async function replayDeskRun(run) {
  const my = ++deskReplay;
  const rec = run.record || {};
  const spec = deskSpec(rec);
  $("#graphWrap").innerHTML = ObsLayout.renderSvg(spec, { direction: "TB" });
  trows.innerHTML = "";
  $("#deskOrder").classList.remove("show");

  const nodes = rec.nodes || [];
  const totalMs = nodes.reduce((s, n) => s + Math.max(1, Number(n.ms) || 1), 0);
  const scale = totalMs ? 2000 / totalMs : 0;
  $("#stageTxt").innerHTML =
    `<span class="live">replaying</span>&nbsp; ${escapeHtml(rec.ticker || "")} · ${escapeHtml(rec.started_at || "")}`;

  for (let i = 0; i < nodes.length; i++) {
    if (my !== deskReplay) return;
    const n = nodes[i];
    const svgNode = document.getElementById("n-" + n.node);
    if (svgNode) { svgNode.classList.remove("done"); svgNode.classList.add("active"); }
    const edge = i > 0 &&
      document.getElementById("e-" + nodes[i - 1].node + "-" + n.node);
    if (edge) edge.classList.add("active");

    const row = el("div", "trow active");
    row.innerHTML =
      `<span class="st">&#9654;</span><span>${escapeHtml(n.node)} · ${escapeHtml(n.note || "")}</span>` +
      `<span></span><span class="num">${Number(n.ms) || 0} ms</span><span class="tag">recorded</span>`;
    trows.appendChild(row);
    row.scrollIntoView({ block: "nearest" });

    await sleep(Math.max(80, (Number(n.ms) || 1) * scale));
    if (my !== deskReplay) return;
    if (svgNode) { svgNode.classList.remove("active"); svgNode.classList.add("done"); }
    if (edge) edge.classList.remove("active");
    row.className = "trow done";
    row.querySelector(".st").innerHTML = "&#10003;";
    row.querySelector(".tag").textContent = "done";
  }

  document.getElementById("endcap")?.classList.add("done");
  $("#stageTxt").textContent =
    `${rec.ticker || ""} · ${rec.verdict || "-"} · ${rec.armed ? "armed" : "not armed"} · ${Number(rec.latency_ms) || 0} ms`;
  showDeskOrder(rec.order || run.order_line || "");
}

function showDeskOrder(text) {
  const box = $("#deskOrder");
  box.innerHTML =
    `<span class="k">order</span><div class="line">${escapeHtml(text || "(no order line)")}</div>` +
    `<button id="copyOrder">copy</button>`;
  box.classList.add("show");
  $("#copyOrder").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text); } catch { return; }
    const b = $("#copyOrder");
    b.textContent = "copied";
    setTimeout(() => { const x = $("#copyOrder"); if (x) x.textContent = "copy"; }, 1200);
  });
}

init();
</script>
